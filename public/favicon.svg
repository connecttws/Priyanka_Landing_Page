<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
  </defs>

  <!-- Smooth Rounded Squircle Background -->
  <rect width="64" height="64" rx="18" fill="url(#pGrad)" />
  
  <!-- Subtle border highlight -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.25" />

  <!-- Botanical Leaf / Thyroid Balance Sprout on top right -->
  <path d="M 37,24 C 37,17 46,14 50,18 C 52,22 49,30 42,30 C 40,28 38,26 37,24 Z" fill="url(#leafGrad)" />
  <path d="M 38,25 Q 44,22 49,19" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.7" />

  <!-- Elegant Letter 'P' Monogram -->
  <text 
    x="29" 
    y="46" 
    font-family="'Playfair Display', Georgia, serif" 
    font-size="40" 
    font-weight="700" 
    fill="#ffffff" 
    text-anchor="middle"
    letter-spacing="-1"
  >P</text>
  
  <!-- Small Vitality Glow Dot -->
  <circle cx="43" cy="43" r="2.5" fill="#fef08a" />
</svg>